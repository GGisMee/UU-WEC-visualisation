[descriptions]
mission_sandbox = "Sandlåda: utforska turbinstorlekar och parametrar med obegränsat antal simuleringar på Lillgrund, en grund havsbaserad plats i Öresund, Sverige."
mission_the_arctic_gale = "Designa en stormhärdad havsturbin på Dogger Bank i Nordsjön. Denna plats har starka, ihållande vindar men är utsatt för extrema arktiska stormbyar och vågor."
mission_the_gentle_breeze = "Designa en vindturbin för hög energiproduktion i lågvindförhållanden vid Smölas skogsområde i Norge. Denna inlandssite har hög ytråhet från träd och strikta zonindelningslagar."
mission_the_community_cooperative = "Bygg en samhällsvänlig landbaserad turbin nära Markbygden, Sverige. Platsen är ett platt jordbrukslandskap nära ett litet samhälle, vilket kräver ljudgränser och hög säkerhet."

drivetrain_HIGH_SPEED_DFIG = "En hög utväxling växlar upp den låga rotorhastigheten (ω) till höga hastigheter. Denna mekaniska förstärkning möjliggör en mindre generatorstorlek och lägre vikt. Den höga hastigheten ökar dock friktionsförluster och värme inuti kuggarna."
drivetrain_MEDIUM_SPEED_SYNCHRONOUS = "En måttlig utväxling minskar mekanisk spänning och rörelseenergi inuti transmissionen. Tillsammans med en synkron generator uppnås bra magnetisk flödeskoppling vid lägre axelhastigheter. Denna inställning balanserar kompromissen mellan vridmoment och hastighet utan att kräva en överdimensionerad statordiameter."
drivetrain_NONE_SYNCHRONOUS = "Generatorns rotor är direkt kopplad till den långsamma turbinaxeln. För att inducera nätspänning vid denna låga hastighet behöver den synkrona generatorn en enorm diameter med många magnetiska polpar. Detta eliminerar slitage på växellådan helt men ökar den strukturella vikten i nacellen."
drivetrain_HIGH_SPEED_ASYNCHRONOUS = "En maximal utväxling ger den höga hastighet som behövs för att skapa magnetisk eftersläpning i asynkronmaskinen. Även om denna höga hastighet håller generatorns volym liten, introducerar de extra växelstegen högre friktion. Inställningen visar hur mekanisk hastighet kan kompensera för en enkel generatortopologi."
drivetrain_MEDIUM_SPEED_ASYNCHRONOUS = "Att driva denna asynkrongenerator med en måttlig hastighet minskar högfrekventa vibrationer i drivlinan. Att sänka ingångsaxelns hastighet komprimerar emellertid det tillgängliga området för magnetisk eftersläpning. Tänk på hur denna skiftande arbetspunkt påverkar moment-hastighetskurvan och kraftomvandlingen."
drivetrain_NONE_DFIG = "Utan en växellåda snurrar DFIG-rotorn vid huvudaxelns mycket låga hastighet. DFIG-maskiner är beroende av höga relativa hastigheter mellan stator- och rotorfält för att inducera spänning. Fundera på hur generatorstorleken måste skalas för att uppnå nominell effekt när ingångsvarvtalet är så här lågt."
drivetrain_MEDIUM_SPEED_DFIG = "Denna uppsättning sänker generatorns ingångshastighet genom att använda ett mindre utväxlingsförhållande. Eftersom en DFIG är optimerad för ett specifikt fönster med högre hastighet, förskjuter en medelhög ingångshastighet systemet bort från sin designpunkt. Titta på hur en lägre mekanisk uppväxling påverkar magnetiseringseffektiviteten."
drivetrain_NONE_ASYNCHRONOUS = "Att ansluta en asynkron maskin direkt till den långsamma turbinrotorn tar bort hastighetsmultiplikatorn. Asynkron induktion förlitar sig kraftigt på höga eftersläpningshastigheter för att skapa ett starkt magnetfält. För att koppla elektromagnetiskt vid lågt varvtal kräver designen ett extremt antal polpar."
drivetrain_HIGH_SPEED_SYNCHRONOUS = "Att använda en snabbgående växellåda med en synkron generator är generellt sett ineffektivt. Synkrona generatorer kan enkelt designas med flera poler för lägre hastigheter, vilket gör den snabbgående växellådan till en onödig källa för mekaniska fel och friktionsförluster."

[descriptions]
mission_sandbox = "Sandbox: explore turbine sizes and parameters with unlimited simulation runs at Lillgrund, a shallow water site in Öresund, Sweden."
mission_the_arctic_gale = "Design a storm-hardened offshore turbine at Dogger Bank in the North Sea. This site features strong, sustained winds but is prone to extreme arctic storm gusts and waves."
mission_the_gentle_breeze = "Design a wind turbine for high energy production in low-wind conditions at Smöla forest site in Norway. This inland site has high surface roughness from trees and strict zoning laws."
mission_the_community_cooperative = "Build a community-friendly onshore turbine near Markbygden, Sweden. The site is a flat agricultural landscape near a small community, requiring noise limits and high safety."

drivetrain_HIGH_SPEED_DFIG = "A high gear ratio steps up the low rotor speed (ω) to high velocities. This mechanical amplification allows for a smaller generator size and lower weight. However, the high speed increases friction losses and heat within the gear teeth."
drivetrain_MEDIUM_SPEED_SYNCHRONOUS = "A moderate gear ratio reduces mechanical stress and kinetic energy inside the transmission. Paired with a synchronous generator, it achieves good magnetic flux linkage at lower shaft speeds. This setup balances the torque-speed trade-off without requiring an oversized stator diameter."
drivetrain_NONE_SYNCHRONOUS = "The generator rotor is locked directly to the low-speed turbine shaft. To induce grid voltage at this low speed, the synchronous generator needs a massive diameter with many magnetic pole pairs. This eliminates gearbox wear completely but increases structural weight in the nacelle."
drivetrain_HIGH_SPEED_ASYNCHRONOUS = "A maximum gear ratio provides the high speed needed to create magnetic slip in the induction machine. While this high velocity keeps the generator volume small, the extra gear stages introduce higher friction. The setup shows how mechanical speed can compensate for a basic generator topology."
drivetrain_MEDIUM_SPEED_ASYNCHRONOUS = "Operating this induction generator at a moderate speed reduces high-frequency drivetrain vibrations. However, lowering the input shaft velocity compresses the available magnetic slip range. Consider how this shifting operating point affects the torque-speed curve and power conversion."
drivetrain_NONE_DFIG = "Without a gearbox, the DFIG rotor spins at the very low velocity of the main shaft. DFIG machines rely on high relative speeds between stator and rotor fields to induce voltage. Consider how the generator size must scale to achieve rated power when input RPM is this low."
drivetrain_MEDIUM_SPEED_DFIG = "This setup lowers the generator input speed by using a smaller gear ratio. Since a DFIG is optimized for a specific, higher velocity window, a medium input speed shifts the system away from its design point. Look at how a lower mechanical step-up impacts the excitation efficiency."
drivetrain_NONE_ASYNCHRONOUS = "Connecting an asynchronous machine directly to the slow turbine rotor removes the speed multiplier. Asynchronous induction relies heavily on high slip speeds to create a strong magnetic field. To couple electromagnetically at low RPM, the design requires an extreme number of pole pairs."
drivetrain_HIGH_SPEED_SYNCHRONOUS = "Using a high-speed gearbox with a synchronous generator is generally inefficient. Synchronous generators can easily be designed with multiple poles for lower speeds, making the high-speed gearbox an unnecessary source of mechanical failure and friction losses."

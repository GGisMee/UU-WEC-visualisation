[project]
name = "uu-wec-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pyinstaller>=6.20.0",
    "scipy>=1.17.1",
]

[tool.pyright]
extraPaths = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]



[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
